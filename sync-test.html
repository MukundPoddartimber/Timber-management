<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S Poddar · Sync Test</title><style>body{font:16px system-ui;background:#f3f6f4;color:#16372d;margin:0;padding:30px}main{max-width:760px;margin:auto;background:white;padding:28px;border-radius:14px}input,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#13694b;color:white;border:0;border-radius:6px;cursor:pointer}section{border-top:1px solid #ddd;margin-top:22px;padding-top:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin-top:8px}</style></head><body><main><h1>S Poddar · Online Sync Test</h1><p>Development test only. Existing dashboard data will not be modified.</p><p id="status">Checking owner session…</p><div id="controls" hidden><button id="refresh">Refresh cloud records</button><section><h2>Add vessel</h2><form id="vesselForm"><label>Vessel name<input name="vessel_name" required></label><label>Loading port<input name="loading_port"></label><label>Discharge port<input name="discharge_port" value="Kandla"></label><label>Cargo type<input name="cargo_type" value="Pine logs"></label><label>Total CBM<input name="total_cbm" type="number" min="0" step=".001"></label><button>Save vessel online</button></form></section><section><h2>Add buyer</h2><form id="buyerForm"><label>Buyer name<input name="buyer_name" required></label><button>Save buyer online</button></form></section><section><h2>Add vessel lot</h2><form id="lotForm"><label>Vessel<select name="vessel_id" id="vesselSelect" required></select></label><label>Buyer<select name="buyer_id" id="buyerSelect"><option value="">Unassigned</option></select></label><label>Lot number<input name="lot_number" required></label><label>BL number<input name="bl_number"></label><label>Timber type<input name="timber_type" value="Pine"></label><label>Pieces<input name="pieces" type="number" min="0" step="1"></label><label>CBM<input name="cbm" type="number" min="0" step=".001"></label><button>Save lot online</button></form></section><section><h2>Cloud records</h2><pre id="records"></pre></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="supabase-config.js"></script><script src="auth-client.js"></script><script src="sync-test.js"></script></body></html>
